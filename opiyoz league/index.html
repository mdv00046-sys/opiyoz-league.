<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>OPIYOZ LEAGUE</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-frame">
    <!-- Top Header / App Bar -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">🎮</span>
        <h1>OPIYOZ LEAGUE</h1>
      </div>
      <span class="status-badge">ONLINE</span>
    </header>

    <!-- Main Content Area / Chat -->
    <main class="chat-container">
      <div id="chat-box" class="chat-box">
        <div class="message bot-message">
          👋 Welcome to <strong>OPIYOZ LEAGUE</strong>! I'm your match assistant. Type <code>help</code> to see commands!
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-container">
        <input type="text" id="user-input" placeholder="Type a message or command..." autocomplete="off" />
        <button id="send-btn">
          <span>Send</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Makes it feel like a mobile app) -->
    <nav class="bottom-nav">
      <button class="nav-item active">
        <span>💬</span>
        <span>Chat</span>
      </button>
      <button class="nav-item">
        <span>🏆</span>
        <span>Standings</span>
      </button>
      <button class="nav-item">
        <span>📋</span>
        <span>Rules</span>
      </button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
