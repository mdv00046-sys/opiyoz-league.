<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPIYOZ LEAGUE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>OPIYOZ LEAGUE</h1>
      <p>Your Ultimate Gaming Assistant</p>
    </header>

    <main class="chat-container">
      <div id="chat-box" class="chat-box">
        <div class="message bot-message">
          Hello! Welcome to <strong>OPIYOZ LEAGUE</strong>. How can I assist your gaming session today?
        </div>
      </div>

      <div class="input-container">
        <input type="text" id="user-input" placeholder="Ask a question or type a command..." />
        <button id="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
